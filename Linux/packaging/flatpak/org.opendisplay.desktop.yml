id: org.opendisplay.desktop
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: opendisplay-gui

finish-args:
  # Wayland + X11 fallback for the GUI window.
  - --socket=wayland
  - --socket=x11
  # Network is required for mDNS discovery and streaming to the iPad over Wi-Fi.
  - --share=network
  # Hardware video encode through VA-API (/dev/dri).
  - --device=dri
  # Talk to the host portals for screen capture and input.
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.portal.RemoteDesktop
  - --talk-name=org.freedesktop.ScreenSaver
  # System tray (StatusNotifierItem): QSystemTrayIcon on Plasma/Waybar
  # registers with the host's watcher over D-Bus. Without these grants
  # isSystemTrayAvailable() stays false and the GUI falls back to a window.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.StatusNotifierItem
  # mDNS discovery: avahi-client talks to the host's avahi-daemon on the
  # SYSTEM bus, which the sandbox filters separately from the session bus.
  - --system-talk-name=org.freedesktop.Avahi
  # USB transport: usbmuxd listens on /var/run/usbmuxd.
  - --filesystem=/var/run/usbmuxd

  # --- Paths that need host access on some setups ---
  # VA-API render node (some drivers want a specific node rather than --device=dri).
  - --filesystem=/dev/dri
  # Hyprland: the backend shells out to `hyprctl`, which the sandbox does not
  # provide, and it talks to the compositor socket under the host's XDG_RUNTIME_DIR.
  # Hyprland support inside the Flatpak is therefore best-effort; KDE works.
  - --filesystem=xdg-run/hypr

modules:
  # avahi-client is used for _opensidecar._tcp mDNS discovery. The KDE/freedesktop
  # runtime does not ship it, so bundle it. Build only the client library the
  # project links against.
  - name: avahi
    config-opts:
      # The Flatpak build sandbox has no /etc/*-release, so avahi's distro
      # autodetection fails. "none" builds the generic Linux target.
      - --with-distro=none
      # Only avahi-client is used (D-Bus client to the host's avahi-daemon);
      # skip every optional integration the KDE runtime does not provide.
      - --disable-libevent
      - --disable-gobject
      - --disable-introspection
      - --disable-autoipd
      - --disable-manpages
      - --disable-xmltoman
      - --disable-libdaemon
      - --enable-shared
      - --disable-static
      - --disable-mono
      - --disable-gtk
      - --disable-gtk3
      - --disable-qt4
      - --disable-qt5
      - --disable-python
      - --disable-python-dbus
      - --disable-gdbm
      # NOTE: D-Bus stays enabled — avahi-client talks to the host's
      # avahi-daemon over the system bus, so this is required.
    sources:
      - type: git
        url: https://github.com/avahi/avahi.git
        tag: v0.8
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/avahi/LICENSE

  # libusbmuxd + libplist are used by the USB transport. The runtime does not
  # ship them, so bundle them from source. These are autotools projects
  # (autogen.sh/configure); flatpak-builder runs autogen.sh since a git
  # checkout has no pre-generated configure script.
  - name: libplist
    config-opts:
      - --without-cython
    sources:
      - type: git
        url: https://github.com/libimobiledevice/libplist.git
        tag: 2.7.0
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    post-install:
      - install -Dm644 /run/build/libplist/COPYING /app/share/licenses/libplist/COPYING

  - name: libimobiledevice-glue
    sources:
      - type: git
        url: https://github.com/libimobiledevice/libimobiledevice-glue.git
        tag: 1.3.2
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    post-install:
      - install -Dm644 /run/build/libimobiledevice-glue/COPYING /app/share/licenses/libimobiledevice-glue/COPYING

  - name: libusbmuxd
    sources:
      - type: git
        url: https://github.com/libimobiledevice/libusbmuxd.git
        tag: 2.1.1
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    post-install:
      - install -Dm644 /run/build/libusbmuxd/COPYING /app/share/licenses/libusbmuxd/COPYING

  # libkscreen is the Plasma screen-management library. It is NOT part of the
  # KDE Frameworks SDK (which is why find_package(KF6Screen) fails), so bundle
  # it. Version 6.6.0 requires Qt 6.10 / KF6 6.22 / PlasmaWaylandProtocols 1.20,
  # all satisfied by the org.kde.Platform 6.10 runtime/SDK. 6.6+ also enables
  # KDE custom virtual resolutions (OD_KSCREEN_HAS_CUSTOM_MODES).
  - name: libkscreen
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DENABLE_TESTING=OFF
      # KWin's Wayland backend requires WaylandServer-private API, which the
      # SDK does not ship; the runtime backends (wayland/xrandr) still build.
      - -DBUILD_KWAYLAND_BACKEND=OFF
    sources:
      - type: git
        url: https://invent.kde.org/plasma/libkscreen.git
        tag: v6.6.0
    cleanup:
      - /include
      - /lib/cmake
      - /share/man
    post-install:
      # libkscreen uses KDE's REUSE layout: license texts live in LICENSES/.
      # Fail loudly if the directory moves so licenses never silently vanish.
      - test -d /run/build/libkscreen/LICENSES
      - mkdir -p /app/share/licenses/libkscreen
      - cp -r /run/build/libkscreen/LICENSES/. /app/share/licenses/libkscreen/

  # The main app. Reuses the repo's CMake target; the container build and this
  # Flatpak share the same opendisplay-core engine.
  - name: opendisplay-gui
    buildsystem: simple
    build-commands:
      # Configure from the repo's Linux/ subdirectory (the module source root is
      # the repository root, which contains Linux/CMakeLists.txt).
      - cmake -S Linux -B _build -DCMAKE_BUILD_TYPE=Release -DOPENDISPLAY_BUILD_GUI=ON -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build _build --parallel
      - cmake --install _build
      # AppStream metadata, icon, and project license (CMake cannot install
      # files outside its source dir).
      - install -Dm644 org.opendisplay.desktop.metainfo.xml /app/share/metainfo/org.opendisplay.desktop.metainfo.xml
      - install -Dm644 public/icon-256.png /app/share/icons/hicolor/256x256/apps/org.opendisplay.desktop.png
      - install -Dm644 LICENSE /app/share/licenses/opendisplay/LICENSE
    sources:
      # Repo root so Linux/CMakeLists.txt and public/icon-256.png are present.
      - type: dir
        path: ../../..
      # AppStream metadata (CMake does not install this).
      - type: file
        path: org.opendisplay.desktop.metainfo.xml
      # Project license (GPL-3.0) ships alongside the app.
      - type: file
        path: ../../../LICENSE
        dest-filename: LICENSE
