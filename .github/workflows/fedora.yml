name: Build Fedora

on:
  push:
    branches: [main, linux-port]
    paths:
      - "Linux/**"
      - ".github/workflows/fedora.yml"
  pull_request:
    paths:
      - "Linux/**"
      - ".github/workflows/fedora.yml"
  workflow_dispatch:

concurrency:
  group: fedora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: fedora-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            fedora-ccache-${{ github.ref }}
            fedora-ccache-main

      - name: Restore dnf package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: fedora-dnf-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            fedora-dnf-${{ github.ref }}
            fedora-dnf-main

      - name: Enable RPM Fusion (for ffmpeg-devel / libx264)
        run: |
          dnf install -y \
            https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm

      - name: Install build dependencies
        run: |
          dnf install -y ccache \
            cmake gcc-c++ ninja-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel \
            kf6-kirigami-devel libkscreen-devel \
            pipewire-devel avahi-devel libusbmuxd-devel wayland-devel \
            ffmpeg ffmpeg-devel

      - name: Configure
        env:
          CCACHE_DIR: /tmp/ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake -S Linux -B build/linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENDISPLAY_BUILD_GUI=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/linux --parallel

      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: opendisplay-linux-fedora
          path: |
            build/linux/opendisplay-linux
            build/linux/opendisplay-gui
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.opendisplay.desktop.flatpak
          manifest-path: Linux/packaging/flatpak/org.opendisplay.desktop.yml
          arch: x86_64
          build-bundle: true

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: opendisplay-gui-flatpak
          path: org.opendisplay.desktop.flatpak
          if-no-files-found: error
